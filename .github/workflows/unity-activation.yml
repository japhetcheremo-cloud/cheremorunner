name: Acquire Unity Activation File (.alf)

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request Unity License Activation File
    runs-on: ubuntu-latest
    steps:
      - name: Request Activation File
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload Manual Activation File (.alf)
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v${{ steps.getUnityVersion.outputs.unityVersion }}.alf
          path: ${{ steps.getUnityVersion.outputs.activationFilePath || '**/*.alf' }}
