name: Android APK Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package and Verify APK
        run: |
          mkdir -p release_output
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -s "$APK_FILE" ]; then
            echo "Successfully generated APK: $APK_FILE"
            cp "$APK_FILE" release_output/CHEREMO-RUNNER.apk
            ls -lh release_output/CHEREMO-RUNNER.apk
          else
            echo "::error::APK build failed or output is missing."
            exit 1
          fi

      - name: Verify APK Integrity
        run: |
          FILE_SIZE=$(stat -c%s release_output/CHEREMO-RUNNER.apk)
          echo "CHEREMO-RUNNER.apk size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 500000 ]; then
            echo "::error::Generated APK is suspiciously small ($FILE_SIZE bytes)."
            exit 1
          fi
          echo "APK successfully verified and validated!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHEREMO-RUNNER-APK
          path: release_output/CHEREMO-RUNNER.apk
          retention-days: 14

      - name: Publish GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
          name: "CHEREMO RUNNER v1.0.0 — Official Android Release"
          body: |
            # 🏃 CHEREMO RUNNER — Official Android Release v1.0.0

            **Tagline:** RUN. DODGE. COLLECT. CONQUER.  
            **Developer:** CHEREMO  
            **Package:** `com.cheremo.runner`  
            **Platform:** Android (Portrait Orientation)  

            ---

            ### 🎮 Features in this Release:
            - **Endless 3D City Track**: Dynamic skyscrapers with glowing windows, lane dividing markings, and procedural streaming.
            - **Responsive Swipe Controls**: Swipe Left/Right to change lanes, Swipe Up to leap hurdles, Swipe Down to slide beneath beams and dive mid-air.
            - **4 Unlockable Runner Skins**: Cheremo Classic, Cyber Phantom, Gold Rush, and Urban Shadow.
            - **Shop & Powerup Upgrades**: Magnet, Shield, and 2X Multiplier with persistent wallet balance.
            - **10 Complete Screens**: Splash, Loading, Main Menu, Character Selection, Shop, HUD, Pause, Game Over, Settings, and Achievements.
            - **100% Offline Play**: Complete local persistence and zero network latency.

            ---

            ### 📲 How to Install & Play:
            1. Download **`CHEREMO-RUNNER.apk`** below.
            2. Open the downloaded file on your Android device.
            3. If Android prompts *"Install unknown apps"*, tap **Settings** and allow installation.
            4. Tap **Install** and enjoy **CHEREMO RUNNER**!
          files: release_output/CHEREMO-RUNNER.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
